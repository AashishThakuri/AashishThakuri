<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Aashish Thakuri Signal Room</title>
  <desc id="description">An animated signal map showing motion, trust, and ideas becoming responsive software systems.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#20242b" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="458" rx="8"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }
    .mono {
      font-family: "Cascadia Mono", "Consolas", monospace;
    }
    .flow {
      stroke-dasharray: 5 13;
      animation: signal-flow 5s linear infinite;
    }
    .cursor {
      animation: cursor-blink 1.1s steps(1) infinite;
    }
    .bar-a { animation: bar-a 2.4s ease-in-out infinite; }
    .bar-b { animation: bar-b 1.8s ease-in-out infinite; }
    .bar-c { animation: bar-c 2.1s ease-in-out infinite; }
    .bar-d { animation: bar-d 2.8s ease-in-out infinite; }
    .status { animation: status-pulse 2.2s ease-in-out infinite; }

    @keyframes signal-flow {
      to { stroke-dashoffset: -72; }
    }
    @keyframes cursor-blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes bar-a { 0%,100% { height: 16px; y: 162px; } 50% { height: 45px; y: 133px; } }
    @keyframes bar-b { 0%,100% { height: 30px; y: 148px; } 50% { height: 12px; y: 166px; } }
    @keyframes bar-c { 0%,100% { height: 9px; y: 169px; } 50% { height: 36px; y: 142px; } }
    @keyframes bar-d { 0%,100% { height: 38px; y: 140px; } 50% { height: 18px; y: 160px; } }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .cursor, .bar-a, .bar-b, .bar-c, .bar-d, .status {
        animation: none;
      }
      .moving-signal { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#0b0d10"/>
    <rect width="1200" height="460" fill="url(#grid)" opacity="0.48"/>
    <rect x="0" y="0" width="1200" height="58" fill="#101318"/>
    <rect x="0" y="411" width="1200" height="49" fill="#101318"/>

    <line x1="0" y1="58" x2="1200" y2="58" stroke="#343a43"/>
    <line x1="0" y1="411" x2="1200" y2="411" stroke="#343a43"/>
    <line x1="585" y1="58" x2="585" y2="411" stroke="#343a43"/>

    <circle cx="28" cy="29" r="5" fill="#ff5a3d"/>
    <circle cx="46" cy="29" r="5" fill="#f2c94c"/>
    <circle cx="64" cy="29" r="5" fill="#62d89b"/>
    <text x="88" y="34" class="mono" fill="#c8ced7" font-size="13">AASHISH / SIGNAL ROOM</text>
    <text x="1162" y="34" class="mono" fill="#727b88" font-size="12" text-anchor="end">KTM 27.7172 N / 85.3240 E</text>

    <g transform="translate(48 102)">
      <text x="0" y="0" class="mono" fill="#727b88" font-size="13">PROFILE / 001</text>
      <text x="0" y="72" fill="#f5f1e8" font-size="66" font-weight="750">AASHISH</text>
      <text x="0" y="136" fill="#f5f1e8" font-size="66" font-weight="750">THAKURI</text>
      <rect x="1" y="156" width="91" height="6" fill="#ff5a3d"/>
      <rect x="101" y="156" width="15" height="6" fill="#f2c94c"/>
      <rect x="125" y="156" width="38" height="6" fill="#62d89b"/>

      <text x="0" y="207" fill="#c8ced7" font-size="19">Full-stack developer from Nepal.</text>
      <text x="0" y="239" fill="#8f98a5" font-size="16">I turn difficult inputs into systems people can use.</text>

      <g transform="translate(0 282)">
        <rect width="449" height="46" rx="4" fill="#101318" stroke="#343a43"/>
        <text x="15" y="29" class="mono" fill="#f5f1e8" font-size="13">build(idea) -&gt; test -&gt; explain -&gt; ship</text>
        <rect class="cursor" x="408" y="15" width="8" height="17" fill="#ff5a3d"/>
      </g>
    </g>

    <g transform="translate(619 88)">
      <text x="0" y="0" class="mono" fill="#727b88" font-size="13">LIVE TRANSFORMATION MAP</text>
      <circle class="status" cx="505" cy="-4" r="4" fill="#62d89b"/>
      <text x="492" y="0" class="mono" fill="#62d89b" font-size="11" text-anchor="end">RUNNING</text>

      <g transform="translate(0 48)">
        <text x="0" y="0" class="mono" fill="#62d89b" font-size="12">01 / MOTION</text>
        <text x="0" y="24" fill="#f5f1e8" font-size="15" font-weight="650">human gesture</text>
        <path d="M 118 18 C 190 18, 191 48, 258 48 S 342 18, 405 18" fill="none" stroke="#36413f" stroke-width="2"/>
        <path class="flow" d="M 118 18 C 190 18, 191 48, 258 48 S 342 18, 405 18" fill="none" stroke="#62d89b" stroke-width="2"/>
        <circle cx="118" cy="18" r="5" fill="#0b0d10" stroke="#62d89b" stroke-width="2"/>
        <circle cx="258" cy="48" r="5" fill="#0b0d10" stroke="#62d89b" stroke-width="2"/>
        <circle cx="405" cy="18" r="5" fill="#0b0d10" stroke="#62d89b" stroke-width="2"/>
        <text x="258" y="73" class="mono" fill="#727b88" font-size="10" text-anchor="middle">VISION</text>
        <text x="425" y="23" class="mono" fill="#c8ced7" font-size="11">LIVE RESPONSE</text>
        <circle class="moving-signal" r="4" fill="#f5f1e8">
          <animateMotion dur="3.8s" repeatCount="indefinite" path="M 118 18 C 190 18, 191 48, 258 48 S 342 18, 405 18"/>
        </circle>
      </g>

      <g transform="translate(0 142)">
        <text x="0" y="0" class="mono" fill="#ff5a3d" font-size="12">02 / TRUST</text>
        <text x="0" y="24" fill="#f5f1e8" font-size="15" font-weight="650">device signals</text>
        <path d="M 118 18 C 180 18, 204 -10, 263 18 S 343 46, 405 18" fill="none" stroke="#453633" stroke-width="2"/>
        <path class="flow" d="M 118 18 C 180 18, 204 -10, 263 18 S 343 46, 405 18" fill="none" stroke="#ff5a3d" stroke-width="2"/>
        <circle cx="118" cy="18" r="5" fill="#0b0d10" stroke="#ff5a3d" stroke-width="2"/>
        <circle cx="263" cy="18" r="5" fill="#0b0d10" stroke="#ff5a3d" stroke-width="2"/>
        <circle cx="405" cy="18" r="5" fill="#0b0d10" stroke="#ff5a3d" stroke-width="2"/>
        <text x="263" y="45" class="mono" fill="#727b88" font-size="10" text-anchor="middle">RISK LOGIC</text>
        <text x="425" y="23" class="mono" fill="#c8ced7" font-size="11">SAFE RECOVERY</text>
        <circle class="moving-signal" r="4" fill="#f5f1e8">
          <animateMotion begin="-1.2s" dur="4.2s" repeatCount="indefinite" path="M 118 18 C 180 18, 204 -10, 263 18 S 343 46, 405 18"/>
        </circle>
      </g>

      <g transform="translate(0 236)">
        <text x="0" y="0" class="mono" fill="#f2c94c" font-size="12">03 / SYSTEM</text>
        <text x="0" y="24" fill="#f5f1e8" font-size="15" font-weight="650">unfinished idea</text>
        <path d="M 118 18 L 177 18 L 210 48 L 284 48 L 316 18 L 405 18" fill="none" stroke="#484332" stroke-width="2"/>
        <path class="flow" d="M 118 18 L 177 18 L 210 48 L 284 48 L 316 18 L 405 18" fill="none" stroke="#f2c94c" stroke-width="2"/>
        <circle cx="118" cy="18" r="5" fill="#0b0d10" stroke="#f2c94c" stroke-width="2"/>
        <circle cx="247" cy="48" r="5" fill="#0b0d10" stroke="#f2c94c" stroke-width="2"/>
        <circle cx="405" cy="18" r="5" fill="#0b0d10" stroke="#f2c94c" stroke-width="2"/>
        <text x="247" y="73" class="mono" fill="#727b88" font-size="10" text-anchor="middle">FULL STACK</text>
        <text x="425" y="23" class="mono" fill="#c8ced7" font-size="11">SHIPPED PRODUCT</text>
        <circle class="moving-signal" r="4" fill="#f5f1e8">
          <animateMotion begin="-2.4s" dur="4.6s" repeatCount="indefinite" path="M 118 18 L 177 18 L 210 48 L 284 48 L 316 18 L 405 18"/>
        </circle>
      </g>

      <g transform="translate(472 30)" opacity="0.72">
        <rect class="bar-a" x="0" y="162" width="5" height="16" fill="#62d89b"/>
        <rect class="bar-b" x="9" y="148" width="5" height="30" fill="#ff5a3d"/>
        <rect class="bar-c" x="18" y="169" width="5" height="9" fill="#f2c94c"/>
        <rect class="bar-d" x="27" y="140" width="5" height="38" fill="#c8ced7"/>
      </g>
    </g>

    <text x="30" y="441" class="mono" fill="#727b88" font-size="12">INPUT  curiosity + difficult problems</text>
    <text x="600" y="441" class="mono" fill="#c8ced7" font-size="12" text-anchor="middle">PROCESS  build / test / explain</text>
    <text x="1170" y="441" class="mono" fill="#727b88" font-size="12" text-anchor="end">OUTPUT  software that responds</text>
    <rect x="0" y="455" width="240" height="5" fill="#ff5a3d" opacity="0.8">
      <animate attributeName="x" values="-240;1200" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="458" rx="8" fill="none" stroke="#343a43" stroke-width="2"/>
</svg>
