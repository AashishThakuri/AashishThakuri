<svg width="1280" height="210" viewBox="0 0 1280 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="210" rx="24" fill="url(#panel)"/>
  <rect x="20" y="20" width="1240" height="170" rx="18" stroke="#334155" stroke-width="2"/>

  <g transform="translate(80 58)" font-family="Consolas, Menlo, monospace">
    <text x="0" y="0" fill="#67e8f9" font-size="18">FEATURED SIGNAL</text>
    <text x="0" y="42" fill="#f8fafc" font-size="34" font-weight="700">Nepal COVID-19 SEIR RK4 Model</text>
    <text x="0" y="78" fill="#cbd5e1" font-size="18">10 fitted beta segments per wave, solved with RK4, explained with data and visuals</text>
  </g>

  <g transform="translate(760 52)" filter="url(#softGlow)">
    <polyline points="0,80 60,80 82,35 112,125 142,65 174,80 250,80 280,42 312,118 348,80 430,80" fill="none" stroke="url(#pulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="540">
      <animate attributeName="stroke-dashoffset" values="540;0;540" dur="4.8s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="82" cy="35" r="6" fill="#22d3ee">
      <animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="42" r="6" fill="#8b5cf6">
      <animate attributeName="r" values="4;8;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="348" cy="80" r="6" fill="#22c55e">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="640" y="176" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94a3b8">signal locked :: keep building :: make the explanation impossible to ignore</text>
</svg>
