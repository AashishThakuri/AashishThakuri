<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
<title id="title">Aashish Thakuri profile manual</title>
<desc id="description">Animated monochrome terminal manual with an ASCII portrait and developer profile details.</desc>
<style>
  .paper { fill: #ffffff; }
  .ink { fill: #1f2328; }
  .muted { fill: #59636e; }
  .line { stroke: #d1d9e0; }
  .soft { fill: #818b98; }
  .only-dark { display: none; }
  .only-light { display: block; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
  .portrait { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; letter-spacing: 0; white-space: pre; fill: #1f2328; }
  .cursor { animation: blink 1s steps(1, end) infinite; }
  .progress { animation: progress 5.8s ease-in-out infinite; transform-origin: 82px 475px; }
  @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
  @keyframes progress { 0% { transform: scaleX(0); } 70%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  @media (prefers-color-scheme: dark) {
    .paper { fill: #0d1117; }
    .ink { fill: #f0f6fc; }
    .muted { fill: #8b949e; }
    .line { stroke: #30363d; }
    .soft { fill: #6e7681; }
    .portrait { fill: #c9d1d9; }
    .only-dark { display: block; }
    .only-light { display: none; }
  }
</style>

