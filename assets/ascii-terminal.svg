<g font-family="Consolas, Menlo, monospace">
<text x="760" y="130" fill="#22d3ee" font-size="18">$ whoami</text>
<text x="760" y="172" fill="#f8fafc" font-size="54" font-weight="700">Aashish Thakuri</text>
<text x="760" y="214" fill="#cbd5e1" font-size="23">developer from Nepal</text>
<text x="760" y="252" fill="#94a3b8" font-size="17">full-stack systems / python / javascript / ai tools</text>
<text x="760" y="312" fill="#22d3ee" font-size="18">$ current_project --focus</text>
<text x="760" y="350" fill="#e2e8f0" font-size="20">Nepal COVID-19 SEIR RK4 Model</text>
<text x="760" y="382" fill="#94a3b8" font-size="16">10 beta segments per wave. RK4 one day at a time.</text>
<text x="760" y="442" fill="#22d3ee" font-size="18">$ build_rule</text>
<text x="760" y="480" fill="#e2e8f0" font-size="18">make it work. make it explainable. make it hard to ignore.</text>
