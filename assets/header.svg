<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="46%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)" opacity="0.55"/>
  <rect x="18" y="18" width="1244" height="324" rx="22" stroke="#334155" stroke-width="2"/>

  <g opacity="0.75">
    <path d="M70 285 C220 210 340 330 490 250 C640 170 780 255 910 205 C1070 145 1135 235 1210 175" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 18">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M70 300 C235 240 355 300 520 230 C650 175 815 300 965 220 C1060 170 1145 250 1210 225" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 22">
      <animate attributeName="stroke-dashoffset" values="0;180" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(92 64)" font-family="Consolas, Menlo, monospace">
    <text x="0" y="0" fill="#67e8f9" font-size="18">AASHISH://PROFILE/COMMAND-CENTER</text>
    <text x="0" y="42" fill="#f8fafc" font-size="58" font-weight="700">Aashish Thakuri</text>
    <text x="0" y="84" fill="#cbd5e1" font-size="24">Full-stack developer from Nepal</text>
    <text x="0" y="122" fill="#94a3b8" font-size="18">building practical systems, AI-powered ideas, and visual explanations</text>
  </g>

  <g transform="translate(830 66)" filter="url(#glow)">
    <circle cx="150" cy="110" r="92" stroke="#0f766e" stroke-width="2" opacity="0.65"/>
    <circle cx="150" cy="110" r="62" stroke="#22d3ee" stroke-width="2" opacity="0.65"/>
    <circle cx="150" cy="110" r="26" stroke="#a78bfa" stroke-width="2" opacity="0.75"/>
    <line x1="150" y1="110" x2="245" y2="110" stroke="#22d3ee" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 150 110" to="360 150 110" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="218" cy="76" r="5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="106" cy="158" r="5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="40" r="4" fill="#34d399">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="16">
    <rect x="90" y="250" width="336" height="44" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="112" y="278" fill="#34d399">status:</text>
    <text x="182" y="278" fill="#e2e8f0">shipping cleaner systems</text>
    <rect x="452" y="250" width="260" height="44" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="474" y="278" fill="#fbbf24">mode:</text>
    <text x="532" y="278" fill="#e2e8f0">learn, build, explain</text>
    <rect x="738" y="250" width="228" height="44" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="760" y="278" fill="#60a5fa">stack:</text>
    <text x="820" y="278" fill="#e2e8f0">python + web</text>
  </g>

  <rect x="-260" y="0" width="260" height="360" fill="url(#beam)" opacity="0.22">
    <animate attributeName="x" values="-260;1280" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
