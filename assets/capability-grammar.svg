<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">KSHAM typed capability grammar</title>
<desc id="desc">Two valid capability compositions showing what Aashish can transform and the tools used.</desc>
<style>
  .label { font: 16px Consolas, "Courier New", monospace; fill: #a94d62; letter-spacing: 0; }
  .cap { font: 700 21px Inter, "Segoe UI", Arial, sans-serif; fill: #181715; letter-spacing: 0; }
  .type { font: 14px Consolas, "Courier New", monospace; fill: #575047; letter-spacing: 0; }
  .statement { font: 17px Georgia, "Times New Roman", serif; fill: #181715; letter-spacing: 0; }
  .tools { font: 13px Consolas, "Courier New", monospace; fill: #575047; letter-spacing: 0; }
