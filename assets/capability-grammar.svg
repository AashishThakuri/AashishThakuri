<text x="1330" y="62" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#575047">TYPE-CHECKED / 89f614a7b909</text>
<line x1="70" y1="92" x2="1330" y2="92" stroke="#a94d62" stroke-width="3"/>
<text x="70" y="137" class="label">RESPONSIVE PRODUCTS</text><line x1="170" y1="225" x2="1230" y2="225" stroke="#e5ddcf" stroke-width="3"/><circle cx="170.0" cy="225" r="7" fill="#a94d62"/><g transform="translate(170.0 187) scale(0.34)"><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(0)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(72)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(144)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(216)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(288)" fill="#d79aa7"/><circle r="4" fill="#f4efe5"/><circle r="2" fill="#a94d62"/></g><text x="170.0" y="267" class="cap" text-anchor="middle">PERCEIVE</text><text x="170.0" y="293" class="type" text-anchor="middle">raw -> signal</text><text x="170.0" y="329" class="statement" text-anchor="middle"><tspan x="170.0" dy="0">make cameras, gestures, and</tspan><tspan x="170.0" dy="24">movement become useful input</tspan></text><text x="170.0" y="401" class="tools" text-anchor="middle"><tspan x="170.0" dy="0">Python / OpenCV / MediaPipe /</tspan><tspan x="170.0" dy="21">real-time vision</tspan></text><text x="346.7" y="212" class="graft" text-anchor="middle">signal = signal</text><circle cx="523.3" cy="225" r="7" fill="#a94d62"/><g transform="translate(523.3 187) scale(0.34)"><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(0)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(72)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(144)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(216)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(288)" fill="#d79aa7"/><circle r="4" fill="#f4efe5"/><circle r="2" fill="#a94d62"/></g><text x="523.3" y="267" class="cap" text-anchor="middle">REASON</text><text x="523.3" y="293" class="type" text-anchor="middle">signal -> decision</text><text x="523.3" y="329" class="statement" text-anchor="middle"><tspan x="523.3" dy="0">turn noisy data and behavior</tspan><tspan x="523.3" dy="24">into adaptive decisions</tspan></text><text x="523.3" y="401" class="tools" text-anchor="middle"><tspan x="523.3" dy="0">NumPy / Pandas / Qwen / LoRA</tspan></text><text x="700.0" y="212" class="graft" text-anchor="middle">decision = decision</text><circle cx="876.7" cy="225" r="7" fill="#a94d62"/><g transform="translate(876.7 187) scale(0.34)"><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(0)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(72)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(144)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(216)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(288)" fill="#d79aa7"/><circle r="4" fill="#f4efe5"/><circle r="2" fill="#a94d62"/></g><text x="876.7" y="267" class="cap" text-anchor="middle">ENGINEER</text><text x="876.7" y="293" class="type" text-anchor="middle">decision -> product</text><text x="876.7" y="329" class="statement" text-anchor="middle"><tspan x="876.7" dy="0">build complete products from</tspan><tspan x="876.7" dy="24">interface to API to database</tspan></text><text x="876.7" y="401" class="tools" text-anchor="middle"><tspan x="876.7" dy="0">React / TypeScript / FastAPI /</tspan><tspan x="876.7" dy="21">MySQL</tspan></text><text x="1053.3" y="212" class="graft" text-anchor="middle">product = product</text><circle cx="1230.0" cy="225" r="7" fill="#a94d62"/><g transform="translate(1230.0 187) scale(0.34)"><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(0)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(72)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(144)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(216)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(288)" fill="#d79aa7"/><circle r="4" fill="#f4efe5"/><circle r="2" fill="#a94d62"/></g><text x="1230.0" y="267" class="cap" text-anchor="middle">SHAPE</text><text x="1230.0" y="293" class="type" text-anchor="middle">product -> experience</text><text x="1230.0" y="329" class="statement" text-anchor="middle"><tspan x="1230.0" dy="0">create spatial, cinematic, and</tspan><tspan x="1230.0" dy="24">responsive digital experiences</tspan></text><text x="1230.0" y="401" class="tools" text-anchor="middle"><tspan x="1230.0" dy="0">Three.js / React Three Fiber /</tspan><tspan x="1230.0" dy="21">GSAP / CSS</tspan></text>
<line x1="70" y1="470" x2="1330" y2="470" stroke="#e5ddcf" stroke-width="2"/>
<text x="70" y="532" class="label">UNDERSTANDABLE MODELS</text><line x1="275" y1="620" x2="1125" y2="620" stroke="#e5ddcf" stroke-width="3"/><circle cx="275.0" cy="620" r="7" fill="#a94d62"/><g transform="translate(275.0 582) scale(0.34)"><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(0)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(72)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(144)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(216)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(288)" fill="#d79aa7"/><circle r="4" fill="#f4efe5"/><circle r="2" fill="#a94d62"/></g><text x="275.0" y="662" class="cap" text-anchor="middle">SIMULATE</text><text x="275.0" y="688" class="type" text-anchor="middle">question -> mechanism</text><text x="275.0" y="724" class="statement" text-anchor="middle"><tspan x="275.0" dy="0">translate real-world change</tspan><tspan x="275.0" dy="24">into equations and numerical</tspan><tspan x="275.0" dy="24">simulations</tspan></text><text x="275.0" y="796" class="tools" text-anchor="middle"><tspan x="275.0" dy="0">SciPy / RK4 / SEIR / Matplotlib</tspan></text><text x="700.0" y="607" class="graft" text-anchor="middle">mechanism = mechanism</text><circle cx="1125.0" cy="620" r="7" fill="#a94d62"/><g transform="translate(1125.0 582) scale(0.34)"><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(0)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(72)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(144)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(216)" fill="#d79aa7"/><path d="M0,-3 C-10,-16 -7,-29 0,-27 C7,-29 10,-16 0,-3 Z" transform="rotate(288)" fill="#d79aa7"/><circle r="4" fill="#f4efe5"/><circle r="2" fill="#a94d62"/></g><text x="1125.0" y="662" class="cap" text-anchor="middle">EXPLAIN</text><text x="1125.0" y="688" class="type" text-anchor="middle">mechanism -> clarity</text><text x="1125.0" y="724" class="statement" text-anchor="middle"><tspan x="1125.0" dy="0">make difficult systems visible</tspan><tspan x="1125.0" dy="24">without making them shallow</tspan></text><text x="1125.0" y="796" class="tools" text-anchor="middle"><tspan x="1125.0" dy="0">visualization / documentation /</tspan><tspan x="1125.0" dy="21">teaching / storytelling</tspan></text>
<text x="70" y="842" font-family="Consolas, monospace" font-size="13" fill="#575047">A graft compiles only when the output type on the left equals the input type on the right.</text>
</svg>
